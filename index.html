<!DOCTYPE html>
<html>

<head>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.29.4/full/pyodide.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>250 Million Flowers</h1>
    <div id="entry">
        <form class="data-entry">
            <label for="start-date">Choose a date:</label>
            <input type="date" id="date" />
        </form>
        <div class="data-entry">
            <label for="name">Or enter some text:</label>
            <input type="text" id="text" placeholder="e.g. your name" />
            <button type="submit" id="submit">Submit</button>
        </div>
    </div>
    <div id="svg-container"></div>

    <script src="index.js"></script>
</body>

</html>
